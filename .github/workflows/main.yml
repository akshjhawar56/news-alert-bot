name: News Alert Bot

on:
  schedule:
    # Run "Check" every 20 minutes
    - cron: '*/20 * * * *'
    # Run "Digest" every day at 6 PM IST (12:30 UTC) -> Let's do 13:00 UTC (6:30 PM IST)
    - cron: '0 13 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install feedparser google-generativeai

      - name: Run Bot (Check Mode)
        if: github.event.schedule != '0 13 * * *' && github.event_name != 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python news_bot.py --mode check

      - name: Run Bot (Digest Mode)
        if: github.event.schedule == '0 13 * * *' || github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python news_bot.py --mode digest

      - name: Commit State Changes
        run: |
          git config --global user.name "NewsBot"
          git config --global user.email "bot@noreply.github.com"
          git add history.json digest_queue.json
          git commit -m "Update state [skip ci]" || echo "No changes to commit"
          git push
